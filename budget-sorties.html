<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Budget Sorties & Voyages — Lycée Léopold ELFORT, Mana</title>
  <meta name="description" content="Outil de calcul du budget prévisionnel des sorties et voyages scolaires — Lycée Polyvalent Léopold ELFORT, Mana, Guyane." />

  <!-- ===========================================================
       DÉPENDANCES (CDN) — fonctionne en local ET en ligne
       React 18 + ReactDOM + Babel (JSX) + Recharts
       =========================================================== -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
  <script crossorigin src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
  <!-- Génération PowerPoint côté navigateur (bundle : inclut JSZip) -->
  <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

  <style>
    /* ===========================================================
       VARIABLES DE COULEUR — identité visuelle de l'établissement
       =========================================================== */
    :root {
      --vert:        #2e7d32;   /* couleur principale : établissement */
      --vert-fonce:  #1b5e20;
      --vert-clair:  #e8f5e9;
      --orange:      #f57c00;   /* couleur secondaire : familles */
      --orange-fonce:#e65100;
      --orange-clair:#fff3e0;
      --blanc:       #ffffff;
      --gris-fond:   #f4f6f5;
      --gris-bord:   #d7dedb;
      --gris-texte:  #455a52;
      --texte:       #1c2b25;
      --bleu-info:   #1565c0;
      --bleu-clair:  #e3f2fd;
      --rouge:       #c62828;
      --rouge-clair: #ffebee;
      --ombre:       0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
      --ombre-fort:  0 4px 14px rgba(0,0,0,.12);
      --radius:      10px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0; padding: 0;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
      color: var(--texte);
      background: var(--gris-fond);
      font-size: 15px;
      line-height: 1.45;
    }

    /* ============================ EN-TÊTE ============================ */
    header.app-header {
      background: linear-gradient(135deg, var(--vert) 0%, var(--vert-fonce) 100%);
      color: var(--blanc);
      padding: 14px 22px;
      display: flex; align-items: center; gap: 16px;
      box-shadow: var(--ombre-fort);
      position: sticky; top: 0; z-index: 50;
    }
    .logo-badge {
      width: 52px; height: 52px; flex: 0 0 52px;
      border-radius: 12px;
      background: var(--blanc);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 22px; color: var(--vert);
      border: 3px solid var(--orange);
      box-shadow: 0 2px 6px rgba(0,0,0,.2);
    }
    .app-header h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: .2px; }
    .app-header .sub { margin: 2px 0 0; font-size: 12.5px; opacity: .9; font-weight: 400; }
    .header-spacer { flex: 1; }
    .save-state {
      font-size: 12px; background: rgba(255,255,255,.18);
      padding: 5px 11px; border-radius: 20px; white-space: nowrap;
    }
    .save-state b { color: #c8e6c9; }

    /* ============================ BARRE D'OUTILS ============================ */
    .toolbar {
      background: var(--blanc);
      border-bottom: 1px solid var(--gris-bord);
      padding: 10px 22px;
      display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
      position: sticky; top: 80px; z-index: 40;
    }

    button {
      font-family: inherit; font-size: 14px; cursor: pointer;
      border: none; border-radius: 8px; padding: 9px 15px;
      font-weight: 600; transition: filter .12s, transform .05s;
      display: inline-flex; align-items: center; gap: 7px;
    }
    button:active { transform: translateY(1px); }
    button:hover { filter: brightness(1.06); }
    .btn-vert    { background: var(--vert); color: #fff; }
    .btn-orange  { background: var(--orange); color: #fff; }
    .btn-gris    { background: #eceff1; color: var(--texte); border: 1px solid var(--gris-bord); }
    .btn-rouge   { background: var(--rouge); color: #fff; }
    .btn-bleu    { background: var(--bleu-info); color: #fff; }
    .btn-sm      { padding: 5px 10px; font-size: 13px; }
    .btn-ico     { padding: 6px 9px; font-size: 15px; }

    /* ============================ MISE EN PAGE ============================ */
    main { max-width: 1180px; margin: 0 auto; padding: 22px; }

    /* ============================ ONGLETS ============================ */
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .tab {
      background: var(--blanc); border: 2px solid var(--gris-bord);
      color: var(--gris-texte); border-radius: 12px;
      padding: 12px 18px; font-weight: 700; font-size: 14.5px;
      display: flex; align-items: center; gap: 9px;
    }
    .tab .num {
      width: 24px; height: 24px; border-radius: 50%;
      background: var(--gris-bord); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; flex: 0 0 24px;
    }
    .tab.actif { border-color: var(--vert); color: var(--vert-fonce); background: var(--vert-clair); }
    .tab.actif .num { background: var(--vert); }
    .tab.actif.tab-bleu { border-color: var(--bleu-info); color: var(--bleu-info); background: var(--bleu-clair); }
    .tab.actif.tab-bleu .num { background: var(--bleu-info); }

    /* ============================ CARTES / SECTIONS ============================ */
    .carte {
      background: var(--blanc); border-radius: var(--radius);
      box-shadow: var(--ombre); margin-bottom: 20px;
      border: 1px solid var(--gris-bord); overflow: hidden;
    }
    .carte > .carte-titre {
      background: var(--vert-clair); color: var(--vert-fonce);
      padding: 12px 18px; font-weight: 700; font-size: 15.5px;
      border-bottom: 1px solid var(--gris-bord);
      display: flex; align-items: center; gap: 9px;
    }
    .carte.orange > .carte-titre { background: var(--orange-clair); color: var(--orange-fonce); }
    .carte-corps { padding: 18px; }

    .etape-pastille {
      display: inline-flex; align-items: center; justify-content: center;
      width: 26px; height: 26px; border-radius: 50%; background: var(--vert);
      color: #fff; font-size: 14px; font-weight: 800; flex: 0 0 26px;
    }
    .carte.orange .etape-pastille { background: var(--orange); }

    /* ============================ FORMULAIRES ============================ */
    .grille {
      display: grid; gap: 14px;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }
    label.champ { display: flex; flex-direction: column; gap: 5px; font-size: 13.5px; font-weight: 600; color: var(--gris-texte); }
    label.champ .oblig { color: var(--rouge); }
    input, select, textarea {
      font-family: inherit; font-size: 14.5px;
      padding: 9px 11px; border: 1px solid var(--gris-bord);
      border-radius: 8px; background: #fff; color: var(--texte); width: 100%;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--vert); box-shadow: 0 0 0 3px var(--vert-clair);
    }
    input.invalide { border-color: var(--rouge); background: var(--rouge-clair); }
    .aide { font-size: 12px; color: var(--gris-texte); font-weight: 400; font-style: italic; }
    .num-input { text-align: right; }

    /* ============================ TABLEAUX ============================ */
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid #eef2f0; }
    th { background: #f1f6f3; font-size: 12.5px; text-transform: uppercase; letter-spacing: .3px; color: var(--gris-texte); }
    td.montant, th.montant { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    tr.cat-ligne td { background: #fafcfb; }
    .tbl-input { padding: 6px 8px; font-size: 13.5px; }
    .tbl-wrap { overflow-x: auto; }

    /* ============================ ENCADRÉS / ALERTES ============================ */
    .info-box, .warn-box, .legal-box {
      border-radius: 8px; padding: 12px 14px; font-size: 13.5px; margin: 6px 0 14px;
      display: flex; gap: 10px; align-items: flex-start;
    }
    .info-box  { background: var(--bleu-clair); border-left: 4px solid var(--bleu-info); color: #0d3c6e; }
    .warn-box  { background: var(--orange-clair); border-left: 4px solid var(--orange); color: var(--orange-fonce); }
    .legal-box { background: #fafafa; border: 1px solid var(--gris-bord); border-left: 4px solid var(--gris-texte); color: var(--gris-texte); font-size: 12.5px; }
    .info-box .ico, .warn-box .ico, .legal-box .ico { font-size: 18px; flex: 0 0 auto; }

    /* ============================ CARTES RÉSULTAT ============================ */
    .resultats { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(210px,1fr)); }
    .res-carte {
      border-radius: var(--radius); padding: 16px; color: #fff;
      box-shadow: var(--ombre); position: relative; overflow: hidden;
    }
    .res-carte .lbl { font-size: 13px; opacity: .92; font-weight: 600; margin-bottom: 6px; }
    .res-carte .val { font-size: 26px; font-weight: 800; line-height: 1.1; }
    .res-carte .note { font-size: 12px; opacity: .9; margin-top: 5px; }
    .res-vert   { background: linear-gradient(135deg, var(--vert), var(--vert-fonce)); }
    .res-orange { background: linear-gradient(135deg, var(--orange), var(--orange-fonce)); }
    .res-bleu   { background: linear-gradient(135deg, #1976d2, #0d47a1); }
    .res-gris   { background: linear-gradient(135deg, #546e7a, #37474f); }
    .res-rouge  { background: linear-gradient(135deg, #e53935, #b71c1c); }

    .phrase-cle {
      background: var(--orange-clair); border: 2px dashed var(--orange);
      border-radius: var(--radius); padding: 16px 18px; margin: 16px 0;
      font-size: 17px; color: var(--orange-fonce); font-weight: 700; text-align: center;
    }
    .phrase-cle b { font-size: 22px; }

    /* ============================ CONTRÔLE BOURSES (bandeau + jauges) ============================ */
    .bandeau-ctrl {
      border-radius: var(--radius); padding: 14px 16px; margin: 0 0 16px;
      display: flex; align-items: center; gap: 14px; border: 2px solid;
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
    .bandeau-ctrl .ico-ctrl { font-size: 30px; flex: 0 0 auto; }
    .bandeau-ctrl .txt b { font-size: 17px; }
    .bandeau-ok    { background: var(--vert-clair);  border-color: var(--vert);   color: var(--vert-fonce); }
    .bandeau-ko    { background: var(--rouge-clair); border-color: var(--rouge);  color: var(--rouge); }
    .bandeau-neutre{ background: var(--bleu-clair);  border-color: var(--bleu-info); color: #0d3c6e; }
    @keyframes pulse-ko { 0%,100%{ box-shadow: 0 0 0 0 rgba(198,40,40,.4);} 50%{ box-shadow: 0 0 0 8px rgba(198,40,40,0);} }
    .bandeau-ko { animation: pulse-ko 1.6s ease-in-out infinite; }

    .jauge-bloc { margin: 10px 0; }
    .jauge-bloc .jauge-lbl { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
    .jauge {
      height: 20px; border-radius: 10px; background: #eceff1; overflow: hidden; position: relative;
      border: 1px solid var(--gris-bord);
    }
    .jauge-fill { height: 100%; border-radius: 10px 0 0 10px; transition: width .25s; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .jauge-fill.ok { background: var(--vert); }
    .jauge-fill.ko { background: var(--rouge); border-radius: 10px; }

    /* ============================ CASCADE DE FINANCEMENT ============================ */
    .cascade { margin: 8px 0 4px; }
    .cascade .ligne {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; border-radius: 8px; margin-bottom: 6px; font-size: 14.5px;
    }
    .cascade .ligne b { font-variant-numeric: tabular-nums; }
    .cascade .l-cout    { background: #eceff1; }
    .cascade .l-subv    { background: var(--bleu-clair); color: #0d3c6e; }
    .cascade .l-reste   { background: #fff8e1; font-weight: 700; }
    .cascade .l-etab    { background: var(--vert-clair); color: var(--vert-fonce); }
    .cascade .l-fam     { background: var(--orange-clair); color: var(--orange-fonce); }

    /* ============================ GRAPHIQUES ============================ */
    .graphiques { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(320px,1fr)); }
    .graph-titre { text-align: center; font-weight: 700; color: var(--gris-texte); margin-bottom: 6px; font-size: 14px; }

    /* ============================ DIVERS ============================ */
    .ligne-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
    .toggle-segment { display: inline-flex; border: 1px solid var(--gris-bord); border-radius: 8px; overflow: hidden; }
    .toggle-segment button { border-radius: 0; background: #fff; color: var(--gris-texte); padding: 7px 13px; }
    .toggle-segment button.on { background: var(--vert); color: #fff; }
    .guide-banner {
      background: #fff; border: 1px solid var(--gris-bord); border-left: 5px solid var(--vert);
      border-radius: var(--radius); padding: 14px 16px; margin-bottom: 18px; box-shadow: var(--ombre);
    }
    .guide-banner h3 { margin: 0 0 8px; color: var(--vert-fonce); font-size: 15px; display: flex; align-items: center; gap: 8px; }
    .guide-banner ol { margin: 6px 0 0; padding-left: 22px; }
    .guide-banner li { margin: 3px 0; font-size: 13.5px; }
    .footer-note { text-align: center; color: var(--gris-texte); font-size: 12px; padding: 18px 0 30px; }

    .delete-x {
      background: var(--rouge-clair); color: var(--rouge);
      border: none; border-radius: 6px; width: 30px; height: 30px;
      font-size: 16px; font-weight: 700; padding: 0; cursor: pointer; line-height: 1;
    }
    .delete-x:hover { background: var(--rouge); color: #fff; }

    /* ============================ IMPRESSION (PDF) ============================ */
    .print-only { display: none; }
    @media print {
      /* Objectif : tenir sur UN RECTO-VERSO (2 pages A4 maximum) */
      @page { margin: 10mm; size: A4; }
      body { background: #fff; font-size: 10px; line-height: 1.25; }
      header.app-header, .toolbar, .tabs, .no-print, .guide-banner,
      .ligne-actions, .delete-x, button,
      .graphiques, .info-box, .footer-note.no-print { display: none !important; }
      /* Les graphiques (camemberts / barres) sont masqués pour rester en 2 pages :
         seuls les tableaux et la synthèse chiffrée sont imprimés. */
      .print-only { display: block; }
      main { max-width: none; padding: 0; }
      .carte { box-shadow: none; border: 1px solid #bbb; break-inside: avoid; margin-bottom: 8px; }
      .carte-corps { padding: 8px 10px; }
      .carte > .carte-titre { padding: 5px 10px; font-size: 11.5px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .res-carte, .res-carte *, .cascade .ligne { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .res-carte { padding: 8px 10px; }
      .res-carte .val { font-size: 17px; }
      .resultats { gap: 6px; break-inside: avoid; }
      .cascade .ligne { padding: 4px 8px; margin-bottom: 3px; }
      input, select, textarea { border: none !important; padding: 1px 0 !important; background: transparent !important; font-size: 10px; }
      .phrase-cle { padding: 8px 10px; font-size: 12px; margin: 8px 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .phrase-cle b { font-size: 15px; }
      .grille { gap: 5px 14px; }
      th, td { padding: 2px 5px; font-size: 9.5px; }
      h4 { margin: 4px 0; }
      hr { margin: 6px 0 !important; }
    }

    @media (max-width: 640px) {
      .app-header h1 { font-size: 16px; }
      .toolbar { top: 76px; }
      main { padding: 14px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
//<![CDATA[
const { useReducer, useState, useEffect, useMemo, useRef } = React;
const {
  PieChart, Pie, Cell, ResponsiveContainer, Tooltip, Legend,
  BarChart, Bar, XAxis, YAxis, CartesianGrid, LabelList
} = Recharts;

/* ===============================================================
   OUTILS / FORMATAGE
   =============================================================== */
const euro = (n) => (isNaN(n) ? 0 : n).toLocaleString("fr-FR", { style: "currency", currency: "EUR", minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nf   = (n) => (isNaN(n) ? 0 : n).toLocaleString("fr-FR", { maximumFractionDigits: 2 });
const num  = (v) => { const n = parseFloat(String(v).replace(",", ".")); return isNaN(n) ? 0 : n; };
const uid  = () => Math.random().toString(36).slice(2, 9);
const auj  = () => new Date().toLocaleDateString("fr-FR", { day: "2-digit", month: "long", year: "numeric" });

/* Palette pour les graphiques (déclinaisons vert / orange / neutres) */
const PALETTE = ["#2e7d32", "#f57c00", "#1976d2", "#7b1fa2", "#00897b", "#c62828", "#5d4037", "#558b2f", "#ef6c00", "#0277bd", "#8e24aa", "#00695c"];

/* ===============================================================
   ÉTAT INITIAL DU BUDGET
   =============================================================== */
function ligneSubvention(source = "", montant = 0) {
  return { id: uid(), source, montant };
}

/* ---------------------------------------------------------------
   MODÈLE DE DEVIS (Sortie ET Erasmus) — une seule table de dépenses.
   Chaque ligne porte une CIBLE : le devis concerne le groupe entier
   (élèves + accompagnateurs), les élèves seuls, ou les accompagnateurs
   seuls. Un devis "groupe" est réparti AU PRORATA des effectifs.
   --------------------------------------------------------------- */
const CATEGORIES_DEVIS = ["Transport", "Hébergement", "Repas", "Activités", "Divers"];
const CIBLES = [
  { id: "groupe", label: "Groupe (élèves + accomp.)", court: "Groupe" },
  { id: "eleves", label: "Élèves seuls", court: "Élèves" },
  { id: "accomp", label: "Accompagnateurs seuls", court: "Accomp." },
];
function ligneDevis(categorie = "Transport", designation = "", cible = "groupe") {
  return { id: uid(), categorie, designation, cible, quantite: 1, prixUnitaire: 0 };
}
/* Ligne "nom" (accompagnateurs Erasmus, saisie multiple) */
function ligneNom(nom = "") {
  return { id: uid(), nom };
}
/* Répartit un montant selon la cible et les effectifs (module SORTIE).
   "groupe" => prorata élèves / accompagnateurs. */
function repartirDevis(total, cible, nbEleves, nbAccomp) {
  if (cible === "eleves") return { el: total, ac: 0 };
  if (cible === "accomp") return { el: 0, ac: total };
  const n = nbEleves + nbAccomp;
  if (n <= 0) return { el: total, ac: 0 };   // pas d'effectif saisi : tout côté élèves
  return { el: total * nbEleves / n, ac: total * nbAccomp / n };
}

/* ---------------------------------------------------------------
   MODULE ERASMUS — QTE déduite automatiquement de la cible :
   - "eleves"  => 1 (forfait global élèves, pas de choix)
   - "groupe"  => nombre d'élèves
   - "accomp"  => nombre d'accompagnateurs
   Ventilation : "groupe" et "eleves" = 100 % élèves ; "accomp" = 100 % accomp.
   --------------------------------------------------------------- */
function qteDevisErasmus(cible, nbEleves, nbAccomp) {
  if (cible === "eleves") return 1;
  if (cible === "accomp") return nbAccomp;
  return nbEleves;   // groupe
}
function repartirErasmus(total, cible) {
  if (cible === "accomp") return { el: 0, ac: total };
  return { el: total, ac: 0 };   // groupe + eleves => 100 % élèves
}
const CIBLES_ERASMUS = [
  { id: "groupe", label: "Groupe" },
  { id: "eleves", label: "Élèves seuls" },
  { id: "accomp", label: "Accompagnateurs seuls" },
];

function etatInitial() {
  return {
    meta: { creeLe: auj(), version: 4 },

    /* -------- MODULE 1 : Sortie / Voyage -------- */
    sortie: {
      nom: "", dates: "", enseignant: "", classes: "",
      nbEleves: 0, nbAccompagnateurs: 0,
      /* Une seule table de devis, chaque ligne ciblant groupe/élèves/accomp. */
      devis: [
        ligneDevis("Transport", "Devis transport (car A/R)", "groupe"),
        ligneDevis("Hébergement", "Nuitées", "groupe"),
        ligneDevis("Repas", "Restauration", "groupe"),
        ligneDevis("Activités", "Entrées / visites", "eleves"),
      ],
      subventions: [
        ligneSubvention("Région", 0),
        ligneSubvention("Rectorat", 0),
      ],
      famillesMontantParEleve: 0,  // montant demandé par élève (0 = aucune participation)
    },

    /* -------- MODULE 2 : Erasmus+ -------- */
    erasmus: {
      intitule: "", reference: "",
      paysVille: "",                 // pays + ville (destination)
      dateDebut: "", dateFin: "",    // dates exactes de début / fin de stage
      /* Objectifs du projet en lien avec l'accréditation (cases à cocher) */
      objectifs: { langues: false, ambitions: false, ecocitoyen: false, personnel: false },
      /* Accompagnateurs : saisie de plusieurs noms */
      accompagnateurs: [ ligneNom("") ],
      nbEleves: 0, nbAccompagnateurs: 0,
      /* Montants de bourse alloués (saisis) — servent au contrôle des dépenses */
      bourseParEleve: 0,
      bourseParAccomp: 0,
      /* Même modèle de devis que la sortie : cible groupe/élèves/accomp. */
      devis: [
        ligneDevis("Transport", "Voyage / mobilité", "groupe"),
        ligneDevis("Hébergement", "Hébergement sur place", "groupe"),
        ligneDevis("Repas", "Restauration", "groupe"),
        ligneDevis("Activités", "Activités pédagogiques", "eleves"),
      ],
      /* Recettes : bourse Erasmus (calculée depuis les montants/personne) + subventions ajoutables */
      subventions: [
        ligneSubvention("Co-financement établissement", 0),
      ],
      famillesMontantParEleve: 0,  // montant demandé par élève (0 = aucune participation)
    },
  };
}

/* ===============================================================
   REDUCER — gestion centralisée du budget
   =============================================================== */
function reducer(state, action) {
  switch (action.type) {
    case "REMPLACER": return action.payload;
    case "RESET":     return etatInitial();

    case "CHAMP": {
      const { module, champ, valeur } = action;
      return { ...state, [module]: { ...state[module], [champ]: valeur } };
    }

    /* ---- listes génériques (depenses, subventions, postes, accompagnateurs) ---- */
    case "LISTE_AJOUT": {
      const { module, cle, item } = action;
      return { ...state, [module]: { ...state[module], [cle]: [...state[module][cle], item] } };
    }
    case "LISTE_SUPPR": {
      const { module, cle, id } = action;
      return { ...state, [module]: { ...state[module], [cle]: state[module][cle].filter(x => x.id !== id) } };
    }
    case "LISTE_MAJ": {
      const { module, cle, id, champ, valeur } = action;
      return {
        ...state,
        [module]: {
          ...state[module],
          [cle]: state[module][cle].map(x => x.id === id ? { ...x, [champ]: valeur } : x),
        },
      };
    }

    default: return state;
  }
}

/* ===============================================================
   PERSISTANCE LOCALE (localStorage)
   =============================================================== */
const CLE_STOCKAGE = "budget_sorties_elfort_v4";
function chargerLocal() {
  try {
    const brut = localStorage.getItem(CLE_STOCKAGE);
    if (!brut) return null;
    const data = JSON.parse(brut);
    const base = etatInitial();
    return { ...base, ...data,
      sortie:  { ...base.sortie,  ...(data.sortie  || {}) },
      erasmus: { ...base.erasmus, ...(data.erasmus || {}) },
    };
  } catch (e) { return null; }
}

/* ===============================================================
   COMPOSANTS RÉUTILISABLES
   =============================================================== */
function Champ({ label, valeur, onChange, type = "text", oblig, aide, placeholder, min, invalide }) {
  return (
    <label className="champ">
      <span>{label}{oblig && <span className="oblig"> *</span>}</span>
      <input
        type={type} value={valeur} placeholder={placeholder} min={min}
        className={(type === "number" ? "num-input " : "") + (invalide ? "invalide" : "")}
        onChange={(e) => onChange(e.target.value)}
      />
      {aide && <span className="aide">{aide}</span>}
    </label>
  );
}

function ResCarte({ classe, lbl, val, note }) {
  return (
    <div className={"res-carte " + classe}>
      <div className="lbl">{lbl}</div>
      <div className="val">{val}</div>
      {note && <div className="note">{note}</div>}
    </div>
  );
}

/* Jauge dépenses vs bourse : verte tant que ≤ bourse, rouge au-delà */
function Jauge({ label, depense, bourse }) {
  const pct = bourse > 0 ? (depense / bourse) * 100 : 0;
  const depasse = bourse > 0 && depense > bourse;
  const largeur = bourse > 0 ? Math.min(100, pct) : 0;
  return (
    <div className="jauge-bloc">
      <div className="jauge-lbl">
        <span>{label}</span>
        <span style={{ color: depasse ? "var(--rouge)" : "var(--gris-texte)", fontWeight: 700 }}>
          {euro(depense)} / {euro(bourse)}{bourse > 0 ? " (" + nf(pct) + " %)" : ""}
          {depasse ? " · dépassement " + euro(depense - bourse) : ""}
        </span>
      </div>
      <div className="jauge">
        <div className={"jauge-fill " + (depasse ? "ko" : "ok")} style={{ width: largeur + "%" }}></div>
      </div>
    </div>
  );
}

function TitreEtape({ n, children }) {
  return (
    <div className="carte-titre">
      <span className="etape-pastille">{n}</span> {children}
    </div>
  );
}

/* ---------------------------------------------------------------
   Conversion d'un graphique (SVG Recharts) en image PNG, copiée
   dans le presse-papiers. Repli : téléchargement du PNG si le
   navigateur bloque l'écriture presse-papiers.
   --------------------------------------------------------------- */
function graphiqueVersPng(conteneur, nomFichier, onStatut) {
  const svg = conteneur && conteneur.querySelector("svg");
  if (!svg) { onStatut && onStatut("Aucun graphique à copier."); return; }
  /* Clone + fond blanc (les PNG transparents rendent mal dans un mail) */
  const clone = svg.cloneNode(true);
  const rect = svg.getBoundingClientRect();
  const w = Math.max(1, Math.round(rect.width));
  const h = Math.max(1, Math.round(rect.height));
  clone.setAttribute("width", w);
  clone.setAttribute("height", h);
  clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
  const fond = document.createElementNS("http://www.w3.org/2000/svg", "rect");
  fond.setAttribute("width", w); fond.setAttribute("height", h); fond.setAttribute("fill", "#ffffff");
  clone.insertBefore(fond, clone.firstChild);
  const donnees = new XMLSerializer().serializeToString(clone);
  const svg64 = "data:image/svg+xml;base64," + window.btoa(unescape(encodeURIComponent(donnees)));
  const img = new Image();
  img.onload = () => {
    const echelle = 2;   // ×2 pour une image nette
    const canvas = document.createElement("canvas");
    canvas.width = w * echelle; canvas.height = h * echelle;
    const ctx = canvas.getContext("2d");
    ctx.scale(echelle, echelle);
    ctx.drawImage(img, 0, 0, w, h);
    canvas.toBlob((blob) => {
      if (!blob) { onStatut && onStatut("Échec de la conversion."); return; }
      /* Tentative copie presse-papiers (API ClipboardItem) */
      if (navigator.clipboard && window.ClipboardItem) {
        navigator.clipboard.write([new window.ClipboardItem({ "image/png": blob })])
          .then(() => onStatut && onStatut("✅ Graphique copié dans le presse-papiers"))
          .catch(() => telechargerBlob(blob, nomFichier, onStatut));
      } else {
        telechargerBlob(blob, nomFichier, onStatut);
      }
    }, "image/png");
  };
  img.onerror = () => onStatut && onStatut("Impossible de générer l'image.");
  img.src = svg64;
}
function telechargerBlob(blob, nomFichier, onStatut) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = nomFichier; a.click();
  URL.revokeObjectURL(url);
  onStatut && onStatut("⬇️ Copie impossible — image téléchargée (PNG)");
}

/* Carte contenant un graphique + bouton "Copier". */
function CarteGraphique({ titre, nomFichier, children }) {
  const ref = useRef(null);
  const [statut, setStatut] = useState(null);
  const copier = () => {
    graphiqueVersPng(ref.current, nomFichier, (msg) => {
      setStatut(msg);
      setTimeout(() => setStatut(null), 3500);
    });
  };
  return (
    <div>
      <div className="graph-titre" style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
        <span>{titre}</span>
        <button className="btn-gris btn-sm no-print" title="Copier le graphique en image" onClick={copier} style={{ padding: "3px 8px", fontSize: 12 }}>📋 Copier</button>
      </div>
      <div ref={ref}>{children}</div>
      {statut && <div className="aide no-print" style={{ textAlign: "center", color: "var(--vert-fonce)", marginTop: 4 }}>{statut}</div>}
    </div>
  );
}

          <div className="graphiques">
            <CarteGraphique titre="Répartition des dépenses par catégorie" nomFichier="depenses_par_categorie.png">
              {calc.depParCategorie.length > 0 ? (
                <ResponsiveContainer width="100%" height={290}>
                  <PieChart>
                    <Pie data={calc.depParCategorie} dataKey="value" nameKey="name" cx="50%" cy="50%" outerRadius={95}
                      label={(e) => nf((e.value / calc.coutTotal) * 100) + "%"}>
                      {calc.depParCategorie.map((e, i) => <Cell key={i} fill={PALETTE[i % PALETTE.length]} />)}
                    </Pie>
                    <Tooltip formatter={(v) => euro(v)} />
                    <Legend wrapperStyle={{ fontSize: 12 }} />
                  </PieChart>
                </ResponsiveContainer>
              ) : <p className="aide" style={{ textAlign: "center" }}>Ajoutez des dépenses pour voir le graphique.</p>}
            </CarteGraphique>
            <CarteGraphique titre="Origine du financement" nomFichier="origine_financement.png">
              {calc.financement.length > 0 ? (
                <ResponsiveContainer width="100%" height={290}>
                  <PieChart>
                    <Pie data={calc.financement} dataKey="value" nameKey="name" cx="50%" cy="50%" outerRadius={95}
                      label={(e) => nf((e.value / calc.coutTotal) * 100) + "%"}>
                      {calc.financement.map((e, i) => <Cell key={i} fill={e.couleur} />)}
                    </Pie>
                    <Tooltip formatter={(v) => euro(v)} />
                    <Legend wrapperStyle={{ fontSize: 12 }} />
                  </PieChart>
                </ResponsiveContainer>
              ) : <p className="aide" style={{ textAlign: "center" }}>Renseignez le financement.</p>}
            </CarteGraphique>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ===============================================================
   MODULE 2 — ERASMUS+
   =============================================================== */
function ModuleErasmus({ state, dispatch, calc }) {
  const e = state.erasmus;
  const set = (champ, valeur) => dispatch({ type: "CHAMP", module: "erasmus", champ, valeur });
  const maj = (id, champ, valeur) => dispatch({ type: "LISTE_MAJ", module: "erasmus", cle: "devis", id, champ, valeur });

  /* -------- Génération d'une présentation PowerPoint (.pptx) -------- */
  const genererPptx = () => {
    if (!window.PptxGenJS) {
      window.alert("La bibliothèque PowerPoint n'a pas pu être chargée (vérifiez votre connexion Internet, puis réessayez).");
      return;
    }
    const V = "2E7D32", O = "F57C00", GRIS = "546E7A", CLAIR = "E8F5E9", ROUGE = "C62828";
    const pptx = new window.PptxGenJS();
    pptx.layout = "LAYOUT_WIDE";           // 13.33 × 7.5 pouces
    pptx.author = "Lycée Léopold ELFORT — Mana";
    pptx.company = "Lycée Polyvalent Léopold ELFORT";

    const enTete = (slide, titre) => {
      slide.addShape(pptx.ShapeType.rect, { x: 0, y: 0, w: 13.33, h: 0.9, fill: { color: V } });
      slide.addText(titre, { x: 0.4, y: 0, w: 12.5, h: 0.9, fontSize: 22, bold: true, color: "FFFFFF", valign: "middle" });
      slide.addText("Lycée Léopold ELFORT · Mana · Guyane Française", { x: 0.4, y: 7.0, w: 12.5, h: 0.4, fontSize: 9, color: GRIS });
    };

    /* ---- Slide 1 : titre ---- */
    const s1 = pptx.addSlide();
    s1.background = { color: "FFFFFF" };
    s1.addShape(pptx.ShapeType.rect, { x: 0, y: 2.3, w: 13.33, h: 2.9, fill: { color: CLAIR } });
    s1.addText("Budget prévisionnel — Projet Erasmus+", { x: 0.5, y: 2.5, w: 12.3, h: 0.5, fontSize: 16, color: O, bold: true, align: "center" });
    s1.addText(e.intitule || "Projet Erasmus+", { x: 0.5, y: 3.0, w: 12.3, h: 1.0, fontSize: 30, color: V, bold: true, align: "center" });
    const fmtDate = (d) => { if (!d) return "—"; const o = new Date(d); return isNaN(o) ? d : o.toLocaleDateString("fr-FR", { day: "2-digit", month: "long", year: "numeric" }); };
    const periodeTxt = (e.dateDebut || e.dateFin) ? ("du " + fmtDate(e.dateDebut) + " au " + fmtDate(e.dateFin)) : "—";
    const objLabels = { langues: "Compétences linguistiques & soft-skills", ambitions: "Ambitions professionnelles & géographiques", ecocitoyen: "Pratiques éco-citoyennes", personnel: "Accompagnement du personnel" };
    const objActifs = Object.keys(objLabels).filter(k => e.objectifs && e.objectifs[k]).map(k => objLabels[k]);
    const infos = [
      "Référence : " + (e.reference || "—"),
      "Stage : " + periodeTxt + "    ·    Lieu : " + (e.paysVille || "—"),
      nf(num(e.nbEleves)) + " élève(s)  ·  " + nf(num(e.nbAccompagnateurs)) + " accompagnateur(s)",
    ];
    s1.addText(infos.join("\n"), { x: 0.5, y: 4.0, w: 12.3, h: 0.9, fontSize: 14, color: "333333", align: "center", lineSpacingMultiple: 1.3 });
    if (objActifs.length) {
      s1.addText("Objectifs : " + objActifs.join(" · "), { x: 0.5, y: 4.9, w: 12.3, h: 0.5, fontSize: 12, italic: true, color: V, align: "center" });
    }
    s1.addText("Lycée Polyvalent Léopold ELFORT — Mana — Guyane Française", { x: 0.5, y: 6.2, w: 12.3, h: 0.4, fontSize: 13, color: V, bold: true, align: "center" });
    s1.addText("Généré le " + auj(), { x: 0.5, y: 6.6, w: 12.3, h: 0.4, fontSize: 11, color: GRIS, align: "center" });

    /* ---- Slide 2 : dépenses ---- */
    const s2 = pptx.addSlide(); s2.background = { color: "FFFFFF" };
    enTete(s2, "Dépenses prévisionnelles");
    const thD = (t) => ({ text: t, options: { bold: true, color: "FFFFFF", fill: V, fontSize: 13, align: t === "Catégorie" ? "left" : "right" } });
    const rowsDep = [[thD("Catégorie"), thD("Élèves"), thD("Accompagnateurs"), thD("Total")]];
    calc.detailCategories.forEach((c) => {
      rowsDep.push([
        { text: c.name, options: { fontSize: 12 } },
        { text: euro(c.el), options: { align: "right", fontSize: 12 } },
        { text: euro(c.ac), options: { align: "right", fontSize: 12 } },
        { text: euro(c.total), options: { align: "right", bold: true, fontSize: 12 } },
      ]);
    });
    rowsDep.push([
      { text: "TOTAL", options: { bold: true, fill: CLAIR, fontSize: 12 } },
      { text: euro(calc.depEleves), options: { align: "right", bold: true, fill: CLAIR, fontSize: 12 } },
      { text: euro(calc.depAccomp), options: { align: "right", bold: true, fill: CLAIR, fontSize: 12 } },
      { text: euro(calc.budgetTotal), options: { align: "right", bold: true, fill: CLAIR, fontSize: 12 } },
    ]);
    s2.addTable(rowsDep, { x: 0.5, y: 1.2, w: 12.3, colW: [5.3, 2.33, 2.34, 2.33], border: { type: "solid", color: "DDDDDD", pt: 1 }, valign: "middle", rowH: 0.45 });

    /* ---- Slide 3 : recettes ---- */
    const s3 = pptx.addSlide(); s3.background = { color: "FFFFFF" };
    enTete(s3, "Recettes / financement");
    const thR = (t, a) => ({ text: t, options: { bold: true, color: "FFFFFF", fill: "1976D2", fontSize: 13, align: a || "left" } });
    const rowsRec = [[thR("Source de financement"), thR("Montant", "right")]];
    rowsRec.push([{ text: "Bourse Erasmus+", options: { fontSize: 12 } }, { text: euro(calc.bourse), options: { align: "right", fontSize: 12 } }]);
    e.subventions.forEach((sub) => {
      rowsRec.push([{ text: sub.source || "Subvention", options: { fontSize: 12 } }, { text: euro(num(sub.montant)), options: { align: "right", fontSize: 12 } }]);
    });
    rowsRec.push([{ text: "Part familles", options: { fontSize: 12 } }, { text: euro(calc.partFamillesTotal), options: { align: "right", fontSize: 12 } }]);
    rowsRec.push([{ text: "TOTAL RECETTES", options: { bold: true, fill: CLAIR, fontSize: 12 } }, { text: euro(calc.totalRecettes), options: { align: "right", bold: true, fill: CLAIR, fontSize: 12 } }]);
    rowsRec.push([{ text: "TOTAL DÉPENSES", options: { bold: true, fill: CLAIR, fontSize: 12 } }, { text: euro(calc.budgetTotal), options: { align: "right", bold: true, fill: CLAIR, fontSize: 12 } }]);
    const libEcart = calc.equilibre ? "Budget équilibré" : (calc.deficit ? "Reste à financer" : "Excédent de recettes");
    const colEcart = calc.equilibre ? V : (calc.deficit ? ROUGE : O);
    rowsRec.push([
      { text: libEcart, options: { bold: true, fontSize: 12, color: colEcart } },
      { text: calc.equilibre ? euro(0) : euro(Math.abs(calc.ecart)), options: { align: "right", bold: true, fontSize: 12, color: colEcart } },
    ]);
    s3.addTable(rowsRec, { x: 0.5, y: 1.2, w: 9.5, colW: [6.5, 3.0], border: { type: "solid", color: "DDDDDD", pt: 1 }, valign: "middle", rowH: 0.42 });
    s3.addText(
      calc.equilibre ? "⚖️ Budget équilibré : dépenses = recettes." : (calc.deficit ? "🔴 Budget non équilibré : reste à financer " + euro(-calc.ecart) + "." : "🟠 Budget non équilibré : excédent de recettes " + euro(calc.ecart) + "."),
      { x: 0.5, y: 6.3, w: 9.5, h: 0.4, fontSize: 13, bold: true, color: colEcart });

    /* ---- Slide 4 : vote du budget ---- */
    const s4 = pptx.addSlide(); s4.background = { color: "FFFFFF" };
    enTete(s4, "Vote du budget prévisionnel");
    s4.addText(e.intitule || "Projet Erasmus+", { x: 0.5, y: 1.1, w: 12.3, h: 0.5, fontSize: 16, bold: true, color: V });
    s4.addText("Budget total soumis au vote : " + euro(calc.budgetTotal), { x: 0.5, y: 1.6, w: 12.3, h: 0.4, fontSize: 14, color: "333333" });
    const thV = (t, a) => ({ text: t, options: { bold: true, color: "FFFFFF", fill: GRIS, fontSize: 13, align: a || "left" } });
    const rowsVote = [
      [thV("Résultat du vote"), thV("Nombre de voix", "center")],
      [{ text: "Pour", options: { fontSize: 13 } }, { text: " ", options: {} }],
      [{ text: "Contre", options: { fontSize: 13 } }, { text: " ", options: {} }],
      [{ text: "Abstention", options: { fontSize: 13 } }, { text: " ", options: {} }],
    ];
    s4.addTable(rowsVote, { x: 0.5, y: 2.3, w: 8.0, colW: [5.0, 3.0], border: { type: "solid", color: "999999", pt: 1 }, valign: "middle", rowH: 0.55 });
    s4.addText("Décision :   ☐ Budget ADOPTÉ        ☐ Budget REJETÉ", { x: 0.5, y: 4.9, w: 12.3, h: 0.4, fontSize: 14, bold: true, color: "333333" });
    s4.addText("Fait à Mana, le ......................................", { x: 0.5, y: 5.6, w: 6, h: 0.4, fontSize: 12, color: "333333" });
    s4.addText("Le chef d'établissement\n\n\n....................................", { x: 0.6, y: 6.0, w: 4, h: 1.2, fontSize: 11, color: "333333" });
    s4.addText("L'agent comptable\n\n\n....................................", { x: 5.0, y: 6.0, w: 4, h: 1.2, fontSize: 11, color: "333333" });
    s4.addText("Le coordinateur du projet\n\n\n....................................", { x: 9.3, y: 6.0, w: 4, h: 1.2, fontSize: 11, color: "333333" });

    const nom = (e.intitule || "erasmus").replace(/[^a-z0-9]/gi, "_").toLowerCase();
    pptx.writeFile({ fileName: "budget_erasmus_" + nom + ".pptx" });
  };

  return (
    <div>
      <div className="carte">
        <TitreEtape n={1}>Informations sur le projet Erasmus+</TitreEtape>
        <div className="carte-corps">
          <div className="grille">
            <Champ label="Intitulé du projet" oblig valeur={e.intitule} onChange={v => set("intitule", v)} placeholder="Titre du projet" invalide={calc.erreurs.intitule} />
            <Champ label="Numéro de référence" oblig valeur={e.reference} onChange={v => set("reference", v)} placeholder="Ex. : 2026-1-FR01-KA122-…" invalide={calc.erreurs.reference} />
            <Champ label="Pays + ville" valeur={e.paysVille} onChange={v => set("paysVille", v)} placeholder="Ex. : Portugal, Lisbonne" />
            <Champ label="Date de début de stage" type="date" valeur={e.dateDebut} onChange={v => set("dateDebut", v)} />
            <Champ label="Date de fin de stage" type="date" valeur={e.dateFin} onChange={v => set("dateFin", v)} />
            <Champ label="Nombre d'élèves participants" oblig type="number" min="0" valeur={e.nbEleves} onChange={v => set("nbEleves", v)} aide="Sert de quantité pour les devis « Groupe »" invalide={calc.erreurs.nbEleves} />
            <Champ label="Nombre d'accompagnateurs" oblig type="number" min="0" valeur={e.nbAccompagnateurs} onChange={v => set("nbAccompagnateurs", v)} aide="Sert de quantité pour les devis « Accompagnateurs »" invalide={calc.erreurs.nbAccomp} />
            <Champ label="Montant de la bourse / élève (€)" type="number" min="0" valeur={e.bourseParEleve} onChange={v => set("bourseParEleve", v)} aide="Contrôle des dépenses élèves" />
            <Champ label="Montant de la bourse / accompagnateur (€)" type="number" min="0" valeur={e.bourseParAccomp} onChange={v => set("bourseParAccomp", v)} aide="Contrôle des dépenses accompagnateurs" />
          </div>

          {/* Objectifs du projet en lien avec l'accréditation */}
          <h4 style={{ margin: "16px 0 8px", color: "var(--gris-texte)" }}>Objectifs du projet (en lien avec l'accréditation)</h4>
          <div style={{ display: "grid", gap: 8, gridTemplateColumns: "repeat(auto-fit, minmax(320px, 1fr))" }}>
            {[
              { cle: "langues",    txt: "Optimiser les compétences linguistiques et les « soft-skills » des apprenants" },
              { cle: "ambitions",  txt: "Élargir les perspectives et développer les ambitions professionnelles et géographiques des apprenants" },
              { cle: "ecocitoyen", txt: "Favoriser des pratiques éco-citoyennes" },
              { cle: "personnel",  txt: "L'accompagnement du personnel pour une meilleure performance professionnelle" },
            ].map((o) => (
              <label key={o.cle} className="objectif-case" style={{
                display: "flex", gap: 9, alignItems: "flex-start", padding: "10px 12px",
                border: "1px solid var(--gris-bord)", borderRadius: 8, cursor: "pointer", fontSize: 13.5,
                background: e.objectifs[o.cle] ? "var(--vert-clair)" : "#fff",
                borderColor: e.objectifs[o.cle] ? "var(--vert)" : "var(--gris-bord)",
              }}>
                <input type="checkbox" checked={!!e.objectifs[o.cle]} style={{ width: "auto", marginTop: 2, accentColor: "var(--vert)" }}
                  onChange={() => set("objectifs", { ...e.objectifs, [o.cle]: !e.objectifs[o.cle] })} />
                <span>{o.txt}</span>
              </label>
            ))}
          </div>

          {/* Accompagnateurs — saisie multiple */}
          <h4 style={{ margin: "16px 0 8px", color: "var(--gris-texte)" }}>Accompagnateurs</h4>
          <div className="tbl-wrap">
            <table>
              <thead><tr><th>Nom Prénom de l'accompagnateur</th><th className="no-print" style={{ width: 40 }}></th></tr></thead>
              <tbody>
                {e.accompagnateurs.map((a) => (
                  <tr key={a.id}>
                    <td><input className="tbl-input" value={a.nom} placeholder="Nom Prénom"
                      onChange={(ev) => dispatch({ type: "LISTE_MAJ", module: "erasmus", cle: "accompagnateurs", id: a.id, champ: "nom", valeur: ev.target.value })} /></td>
                    <td className="no-print"><button className="delete-x" onClick={() => dispatch({ type: "LISTE_SUPPR", module: "erasmus", cle: "accompagnateurs", id: a.id })}>×</button></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="ligne-actions no-print">
            <button className="btn-vert btn-sm" onClick={() => dispatch({ type: "LISTE_AJOUT", module: "erasmus", cle: "accompagnateurs", item: ligneNom() })}>＋ Ajouter un accompagnateur</button>
            {num(e.nbAccompagnateurs) > 0 && e.accompagnateurs.filter(a => a.nom.trim()).length !== num(e.nbAccompagnateurs) && (
              <span className="aide">ℹ️ {e.accompagnateurs.filter(a => a.nom.trim()).length} nom(s) saisi(s) pour {nf(num(e.nbAccompagnateurs))} accompagnateur(s) déclaré(s).</span>
            )}
          </div>
        </div>
      </div>

      <div className="carte">
        <TitreEtape n={2}>Les dépenses (devis)</TitreEtape>
        <div className="carte-corps">

          {/* ===== CONTRÔLE PERMANENT DES BOURSES (toujours visible) ===== */}
          {calc.boursesTotal <= 0 ? (
            <div className="bandeau-ctrl bandeau-neutre">
              <span className="ico-ctrl">ℹ️</span>
              <div className="txt">Renseignez les <b>montants de bourse</b> (par élève et par accompagnateur) en partie 1 pour activer le contrôle automatique du dépassement.</div>
            </div>
          ) : calc.depassementTotal ? (
            <div className="bandeau-ctrl bandeau-ko">
              <span className="ico-ctrl">🚨</span>
              <div className="txt">
                <b>DÉPASSEMENT DES BOURSES</b><br/>
                Dépenses <b>{euro(calc.budgetTotal)}</b> &gt; bourses allouées <b>{euro(calc.boursesTotal)}</b> —
                à financer autrement (subventions / familles) : <b>{euro(calc.budgetTotal - calc.boursesTotal)}</b>.
              </div>
            </div>
          ) : (
            <div className="bandeau-ctrl bandeau-ok">
              <span className="ico-ctrl">✅</span>
              <div className="txt">
                <b>Dépenses dans l'enveloppe des bourses</b><br/>
                Dépenses <b>{euro(calc.budgetTotal)}</b> / bourses <b>{euro(calc.boursesTotal)}</b> —
                marge restante : <b>{euro(calc.boursesTotal - calc.budgetTotal)}</b>.
              </div>
            </div>
          )}

          {calc.boursesTotal > 0 && (
            <div style={{ marginBottom: 16 }}>
              <Jauge label="🎒 Élèves" depense={calc.depEleves} bourse={calc.boursesEleves} />
              <Jauge label="🧑‍🏫 Accompagnateurs" depense={calc.depAccomp} bourse={calc.boursesAccomp} />
              <Jauge label="Σ Total" depense={calc.budgetTotal} bourse={calc.boursesTotal} />
            </div>
          )}

          <div className="info-box">
            <span className="ico">💡</span>
            <span>Pour chaque devis, choisissez la <b>catégorie</b> et <b>qui il concerne</b>. La <b>quantité</b> est déduite automatiquement :
              <b style={{color:"var(--vert-fonce)"}}> Groupe</b> → nombre d'élèves ·
              <b> Élèves seuls</b> → 1 (forfait) ·
              <b style={{color:"var(--orange-fonce)"}}> Accompagnateurs seuls</b> → nombre d'accompagnateurs.
              Saisissez uniquement le <b>prix unitaire</b>.</span>
          </div>
          <div className="tbl-wrap">
            <table>
              <thead>
                <tr>
                  <th style={{ width: 130 }}>Catégorie</th>
                  <th>Désignation (devis)</th>
                  <th style={{ width: 170 }}>Concerne</th>
                  <th className="montant" style={{ width: 70 }}>Qté</th>
                  <th className="montant" style={{ width: 110 }}>Prix unit.</th>
                  <th className="montant" style={{ width: 105 }}>Total</th>
                  <th className="montant" style={{ width: 95 }}>dont élèves</th>
                  <th className="montant" style={{ width: 95 }}>dont accomp.</th>
                  <th className="no-print" style={{ width: 40 }}></th>
                </tr>
              </thead>
              <tbody>
                {e.devis.map((d) => {
                  const qte = qteDevisErasmus(d.cible, num(e.nbEleves), num(e.nbAccompagnateurs));
                  const total = qte * num(d.prixUnitaire);
                  const { el, ac } = repartirErasmus(total, d.cible);
                  return (
                    <tr key={d.id} className="cat-ligne">
                      <td>
                        <select className="tbl-input" value={d.categorie} onChange={(ev) => maj(d.id, "categorie", ev.target.value)}>
                          {CATEGORIES_DEVIS.map(c => <option key={c} value={c}>{c}</option>)}
                        </select>
                      </td>
                      <td><input className="tbl-input" value={d.designation}
                        onChange={(ev) => maj(d.id, "designation", ev.target.value)} placeholder="Ex. : mobilité, hébergement…" /></td>
                      <td>
                        <select className="tbl-input" value={d.cible} onChange={(ev) => maj(d.id, "cible", ev.target.value)}>
                          {CIBLES_ERASMUS.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
                        </select>
                      </td>
                      {/* QTE déduite automatiquement (non modifiable) */}
                      <td className="montant" title="Quantité déduite de la cible et des effectifs (partie 1)"><b>{nf(qte)}</b></td>

          <div className="tbl-wrap">

          <datalist id="liste-financeurs-erasmus">

            <div className="ligne l-cout"><span>Dépenses élèves</span><b>{euro(calc.depEleves)}</b></div>
            <div className="ligne l-cout"><span>+ Dépenses accompagnateurs</span><b>{euro(calc.depAccomp)}</b></div>
            <div className="ligne l-cout" style={{ fontWeight: 700 }}><span>= Total dépenses</span><b>{euro(calc.budgetTotal)}</b></div>
            <div style={{ fontSize: 12.5, color: "var(--gris-texte)", margin: "8px 2px 4px", fontWeight: 700, textTransform: "uppercase", letterSpacing: ".3px" }}>Recettes</div>

              <span className="ico-ctrl">🟠</span>
              <div className="txt">
                <b>Budget NON équilibré — EXCÉDENT DE RECETTES : {euro(calc.ecart)}</b><br/>
                Recettes <b>{euro(calc.totalRecettes)}</b> &gt; dépenses <b>{euro(calc.budgetTotal)}</b>.
                Réduisez la part familles ou une subvention, ou ajustez les dépenses prévues.
              </div>

          <div className="resultats" style={{ marginTop: 16 }}>

            <ResCarte classe="res-bleu" lbl="Total recettes" val={euro(calc.totalRecettes)} note="bourse + subv. + familles" />
            <ResCarte classe="res-vert" lbl="Couverture Erasmus+" val={nf(calc.couverture) + " %"} note={euro(calc.bourse) + " de bourse"} />
            <ResCarte classe={calc.equilibre ? "res-vert" : (calc.deficit ? "res-rouge" : "res-orange")}
              lbl={calc.equilibre ? "⚖️ Équilibre" : (calc.deficit ? "🔴 Reste à financer" : "🟠 Excédent")}
              val={calc.equilibre ? "0,00 €" : euro(Math.abs(calc.ecart))}
              note={calc.equilibre ? "dépenses = recettes ✔" : (calc.deficit ? "recettes insuffisantes" : "recettes en trop")} />
          </div>

          {/* --- Synthèse PAR ÉLÈVE : dépenses ET recettes --- */}
          <h4 style={{ margin: "18px 0 8px", color: "var(--gris-texte)" }}>Par élève</h4>
          <div className="resultats">
            <ResCarte classe="res-gris" lbl="🎒 Dépense par élève" val={euro(calc.depParEleve)} note={num(e.nbEleves) > 0 ? "coût élèves ÷ " + nf(num(e.nbEleves)) + " élève(s)" : "renseignez le nb d'élèves"} />
            <ResCarte classe="res-orange" lbl="👤 Recette par élève (famille)" val={euro(calc.partParEleve)} note={num(e.nbEleves) > 0 ? "ce que paie chaque famille" : "renseignez le nb d'élèves"} />
          </div>

          {num(e.nbEleves) > 0 && calc.partFamillesTotal > 0 && (
            <div className="phrase-cle">
              👉 Chaque famille devra payer environ <b>{euro(calc.partParEleve)}</b> par élève.
            </div>
          )}

          <div className="carte" style={{ marginTop: 16 }}>
            <div className="carte-corps">
              <CarteGraphique titre="📊 Équilibre Dépenses / Recettes" nomFichier="equilibre_budget_erasmus.png">
                {calc.budgetTotal > 0 ? (
                  <ResponsiveContainer width="100%" height={340}>
                    <BarChart data={calc.barresCumul} margin={{ left: 10, right: 20, top: 24 }}>
                      <CartesianGrid strokeDasharray="3 3" vertical={false} />
                      <XAxis dataKey="name" fontSize={13} />
                      <YAxis tickFormatter={(v) => nf(v) + " €"} fontSize={11} />
                      <Tooltip formatter={(v, n) => [euro(v), n]} />
                      <Legend wrapperStyle={{ fontSize: 12 }} />
                      {calc.seriesCumul.map((s, i) => (
                        <Bar key={s.cle} dataKey={s.cle} name={s.nom} stackId="pile" fill={s.couleur} maxBarSize={120}>
                          {/* Valeur dans chaque segment (masquée si 0) */}
                          <LabelList dataKey={s.cle} position="center" fontSize={12} fontWeight={700} fill="#fff"
                            formatter={(v) => (v > 0 ? euro(v) : "")} />
                          {/* Total de la colonne au sommet (sur la dernière série de la pile) */}
                          {i === calc.seriesCumul.length - 1 && (
                            <LabelList position="top" fontSize={13} fontWeight={800} fill="var(--texte)"
                              formatter={(v) => ""} content={(props) => {
                                const { x, y, width, index } = props;
                                const total = calc.seriesCumul.reduce((t, ss) => t + (calc.barresCumul[index][ss.cle] || 0), 0);

                                return <text x={x + width / 2} y={y - 8} textAnchor="middle" fontSize={13} fontWeight={800} fill="#1c2b25">{euro(total)}</text>;
                              }} />

                    </BarChart>
                  </ResponsiveContainer>
                ) : <p className="aide" style={{ textAlign: "center" }}>Renseignez les devis pour voir le graphique.</p>}
              </CarteGraphique>
              <div className="aide" style={{ textAlign: "center", marginTop: 6 }}>
                Comparez la hauteur des deux colonnes : si les <b>recettes</b> sont plus basses que les <b>dépenses</b>, l'écart correspond au <b>reste à financer</b>.
              </div>
            </div>
          </div>

          {/* Bouton export PowerPoint */}

            <button className="btn-orange" onClick={genererPptx}>📊 Créer le PowerPoint (dépenses, recettes + vote)</button>
          </div>
          <div className="aide no-print" style={{ textAlign: "center" }}>
            Génère une présentation .pptx : page de titre, dépenses, recettes, et une slide de vote du budget.

        </div>
      </div>
    </div>
  );
}

/* ===============================================================
   APPLICATION PRINCIPALE
   =============================================================== */
function App() {
  const [state, dispatch] = useReducer(reducer, undefined, () => chargerLocal() || etatInitial());
  const [onglet, setOnglet] = useState("sortie");   // sortie | erasmus
  const [sauveLe, setSauveLe] = useState(null);
  const premierRendu = useRef(true);

  /* ---- Sauvegarde automatique dans localStorage (anti-rebond) ---- */
  useEffect(() => {
    if (premierRendu.current) { premierRendu.current = false; return; }
    const t = setTimeout(() => {
      try {
        localStorage.setItem(CLE_STOCKAGE, JSON.stringify(state));
        setSauveLe(new Date().toLocaleTimeString("fr-FR"));
      } catch (e) { /* quota plein : on ignore */ }
    }, 500);
    return () => clearTimeout(t);
  }, [state]);

  /* ============================================================
     CALCULS — MODULE 1 (Sortie)
     - Accompagnateurs : 100 % établissement / subventions (jamais familles)
     - Subventions affectées d'abord aux accompagnateurs, puis aux élèves
     ============================================================ */
  const calcSortie = useMemo(() => {
    const s = state.sortie;
    const nbEleves = num(s.nbEleves);
    const nbAccomp = num(s.nbAccompagnateurs);

    /* --- Ventilation des devis en part ÉLÈVES / part ACCOMPAGNATEURS ---
       Un devis "groupe" est réparti au prorata des effectifs. */
    let depEleves = 0, depAccomp = 0;
    const parCategorie = {};   // { cat: {el, ac, total} } pour le détail/camembert
    s.devis.forEach((d) => {
      const total = num(d.quantite) * num(d.prixUnitaire);
      const { el, ac } = repartirDevis(total, d.cible, nbEleves, nbAccomp);
      depEleves += el; depAccomp += ac;
      const cat = d.categorie || "Divers";
      if (!parCategorie[cat]) parCategorie[cat] = { el: 0, ac: 0, total: 0 };
      parCategorie[cat].el += el; parCategorie[cat].ac += ac; parCategorie[cat].total += total;
    });
    const totalDepenses = depEleves;               // dépenses élèves (De)
    const Da = depAccomp;                           // dépenses accompagnateurs
    const coutTotal = depEleves + depAccomp;
    const totalSubventions = s.subventions.reduce((t, x) => t + num(x.montant), 0);

    /* Subventions affectées EN PRIORITÉ aux accompagnateurs (jamais à la
       charge des familles), puis le reliquat aux dépenses élèves */
    const subvPourAccomp = Math.min(totalSubventions, Da);
    const accompResteEtab = Da - subvPourAccomp;           // accompagnateurs pris par l'établissement
    const subvResteEleves = totalSubventions - subvPourAccomp;
    const resteEleves = Math.max(0, totalDepenses - subvResteEleves);

    /* Part familles = montant saisi par élève, plafonné au reste à charge élèves
       (les familles ne paient jamais les accompagnateurs). L'établissement complète. */
    const famillesSaisi = num(s.famillesMontantParEleve) * nbEleves;
    const partFamillesTotal = Math.min(famillesSaisi, resteEleves);
    const partEtabEleves = resteEleves - partFamillesTotal;

    /* Part ÉTABLISSEMENT = reliquat accompagnateurs + reliquat dépenses élèves */
    const partEtabTotal = accompResteEtab + partEtabEleves;

    /* Indicateurs PAR ÉLÈVE */
    const depParEleve  = nbEleves > 0 ? depEleves / nbEleves : 0;         // dépense/élève
    const partParEleve = nbEleves > 0 ? partFamillesTotal / nbEleves : 0; // recette (famille)/élève

    /* Contrôle d'équilibre */
    const totalRecettes = totalSubventions + partFamillesTotal + partEtabTotal;
    const resteAFinancer = Math.max(0, coutTotal - totalRecettes);

    /* Camembert dépenses par catégorie (total groupe) */
    const depParCategorie = Object.entries(parCategorie)
      .map(([name, v]) => ({ name, value: v.total })).filter(x => x.value > 0);

    /* Détail par catégorie ventilé élèves/accomp. (tableau de synthèse) */
    const detailCategories = Object.entries(parCategorie)
      .map(([name, v]) => ({ name, el: v.el, ac: v.ac, total: v.total }))
      .filter(x => x.total > 0);

    /* financement (camembert) */
    const financement = [];
    if (totalSubventions > 0) financement.push({ name: "Subventions", value: totalSubventions, couleur: "#1976d2" });
    if (partEtabTotal > 0)    financement.push({ name: "Établissement", value: partEtabTotal, couleur: "#2e7d32" });
    if (partFamillesTotal > 0)financement.push({ name: "Familles", value: partFamillesTotal, couleur: "#f57c00" });

    /* Barres CUMULATIVES : Dépenses (élèves + accomp.) vs Recettes (subv. + étab. + familles) */
    const barresCumul = [
      { name: "Dépenses", eleves: depEleves, accomp: depAccomp,
        subventions: 0, etablissement: 0, familles: 0 },
      { name: "Recettes", eleves: 0, accomp: 0,
        subventions: totalSubventions, etablissement: partEtabTotal, familles: partFamillesTotal },
    ];
    const seriesCumul = [
      { cle: "eleves",        nom: "Dépenses élèves",         couleur: "#2e7d32" },
      { cle: "accomp",        nom: "Dépenses accompagnateurs", couleur: "#9ccc65" },
      { cle: "subventions",   nom: "Subventions",             couleur: "#1976d2" },
      { cle: "etablissement", nom: "Part établissement",      couleur: "#7b1fa2" },
      { cle: "familles",      nom: "Part familles",           couleur: "#f57c00" },
    ];

    const erreurs = {
      nom: !s.nom.trim(),
      enseignant: !s.enseignant.trim(),
      nbEleves: nbEleves <= 0,
    };

    return { depEleves, depAccomp, totalDepenses, totalAccomp: Da, coutTotal, totalSubventions,
      subvPourAccomp, accompResteEtab, subvResteEleves, resteEleves,
      partEtabEleves, partEtabTotal, partFamillesTotal, partParEleve, depParEleve,
      totalRecettes, resteAFinancer, depParCategorie, detailCategories, financement,
      barresCumul, seriesCumul, erreurs };
  }, [state.sortie]);

  /* ============================================================
     CALCULS — MODULE 2 (Erasmus)
     - Budget total = postes + accompagnateurs
     - Financé par bourse Erasmus / établissement / autres subv. / familles
     ============================================================ */
  const calcErasmus = useMemo(() => {
    const e = state.erasmus;
    const nbEleves = num(e.nbEleves);
    const nbAccomp = num(e.nbAccompagnateurs);

    /* --- Ventilation des devis : QTE déduite de la cible ---
       groupe = nbEleves, eleves = 1, accomp = nbAccomp ; groupe+eleves => 100 % élèves */
    let depEleves = 0, depAccomp = 0;
    const parCategorie = {};
    e.devis.forEach((d) => {
      const qte = qteDevisErasmus(d.cible, nbEleves, nbAccomp);
      const total = qte * num(d.prixUnitaire);
      const { el, ac } = repartirErasmus(total, d.cible);
      depEleves += el; depAccomp += ac;
      const cat = d.categorie || "Divers";
      if (!parCategorie[cat]) parCategorie[cat] = { el: 0, ac: 0, total: 0 };
      parCategorie[cat].el += el; parCategorie[cat].ac += ac; parCategorie[cat].total += total;
    });
    const Da = depAccomp;
    const budgetTotal = depEleves + depAccomp;

    /* --- Contrôle bourses allouées (saisies en partie 1) --- */
    const boursesEleves = num(e.bourseParEleve) * nbEleves;
    const boursesAccomp = num(e.bourseParAccomp) * nbAccomp;
    const boursesTotal  = boursesEleves + boursesAccomp;
    const depassementEleves = boursesEleves > 0 && depEleves > boursesEleves;
    const depassementAccomp = boursesAccomp > 0 && depAccomp > boursesAccomp;
    const depassementTotal  = boursesTotal > 0 && budgetTotal > boursesTotal;

    /* Recettes : bourse Erasmus (= total des bourses allouées, calculée) + subventions.
       La bourse reçue n'est PLUS saisie : elle vaut nbEleves×bourse/élève + nbAccomp×bourse/accomp. */
    const bourse = boursesTotal;
    const totalSubventions = e.subventions.reduce((t, x) => t + num(x.montant), 0);
    const financements = bourse + totalSubventions;

    /* Financements affectés EN PRIORITÉ aux accompagnateurs (jamais aux familles) */
    const financPourAccomp = Math.min(financements, Da);
    const accompResteEtab = Da - financPourAccomp;
    const financPourEleves = financements - financPourAccomp;
    const resteEleves = Math.max(0, depEleves - financPourEleves);

    /* Part familles = montant saisi par élève, plafonné au reste à charge élèves */
    const partFamillesTotal = Math.min(num(e.famillesMontantParEleve) * nbEleves, resteEleves);
    const partParEleve = nbEleves > 0 ? partFamillesTotal / nbEleves : 0;
    const depParEleve = nbEleves > 0 ? depEleves / nbEleves : 0;

    const couverture = budgetTotal > 0 ? (bourse / budgetTotal) * 100 : 0;
    const resteAFinancer = Math.max(0, budgetTotal - financements - partFamillesTotal);

    /* --- ÉQUILIBRE DU BUDGET : Recettes vs Dépenses (écart signé) --- */
    const totalRecettes = bourse + totalSubventions + partFamillesTotal;
    const ecart = totalRecettes - budgetTotal;          // >0 excédent, <0 déficit
    const equilibre = Math.abs(ecart) < 0.005;
    const excedent  = ecart > 0.005;
    const deficit   = ecart < -0.005;

    /* Camemberts / détail */
    const depParCategorie = Object.entries(parCategorie)
      .map(([name, v]) => ({ name, value: v.total })).filter(x => x.value > 0);
    const detailCategories = Object.entries(parCategorie)
      .map(([name, v]) => ({ name, el: v.el, ac: v.ac, total: v.total })).filter(x => x.total > 0);

    /* Barres CUMULATIVES : 2 colonnes empilées à comparer
       - "Dépenses" = élèves + accompagnateurs
       - "Recettes" = bourse + subventions + familles (sans le reste à financer) */
    const barresCumul = [
      { name: "Dépenses", eleves: depEleves, accomp: depAccomp,
        bourse: 0, subventions: 0, familles: 0 },
      { name: "Recettes", eleves: 0, accomp: 0,
        bourse: bourse, subventions: totalSubventions, familles: partFamillesTotal },
    ];
    /* Séries affichées (clé, libellé, couleur) */
    const seriesCumul = [
      { cle: "eleves",      nom: "Dépenses élèves",        couleur: "#2e7d32" },
      { cle: "accomp",      nom: "Dépenses accompagnateurs", couleur: "#9ccc65" },
      { cle: "bourse",      nom: "Bourse Erasmus+",        couleur: "#1976d2" },
      { cle: "subventions", nom: "Subventions",            couleur: "#7b1fa2" },
      { cle: "familles",    nom: "Part familles",          couleur: "#f57c00" },
    ];

    const erreurs = {
      intitule: !e.intitule.trim(),
      reference: !e.reference.trim(),
      nbEleves: nbEleves <= 0,
      nbAccomp: nbAccomp <= 0,
    };

    return { depEleves, depAccomp, totalAccomp: Da, budgetTotal, bourse, totalSubventions,
      accompResteEtab, resteEleves, couverture, resteAFinancer,
      partFamillesTotal, partParEleve, depParEleve,
      boursesEleves, boursesAccomp, boursesTotal,
      depassementEleves, depassementAccomp, depassementTotal,
      totalRecettes, ecart, equilibre, excedent, deficit,
      depParCategorie, detailCategories, barresCumul, seriesCumul, erreurs };
  }, [state.erasmus]);

  /* ============================================================
     ACTIONS GLOBALES
     ============================================================ */
  const nouveauBudget = () => {
    if (window.confirm("Créer un nouveau budget ? Les données actuelles seront effacées (la sauvegarde locale aussi).")) {
      localStorage.removeItem(CLE_STOCKAGE);
      dispatch({ type: "RESET" });
      setOnglet("sortie");
    }
  };
  /* Réinitialisation : efface toutes les données saisies (les deux modules)
     et la sauvegarde locale, puis repart d'un budget vierge */
  const reinitialiser = () => {
    if (window.confirm("Réinitialiser : effacer toutes les données saisies (Sortie ET Erasmus) ? Cette action est irréversible.")) {
      localStorage.removeItem(CLE_STOCKAGE);
      dispatch({ type: "RESET" });
    }
  };
  /* Transmission par courriel à l'établissement.
     Le PDF ne peut pas être joint automatiquement par le navigateur :
     on pré-remplit le courriel et on rappelle de joindre le PDF généré. */
  const COURRIEL_ETAB = "ce.9730421v@ac-guyane.fr";
  const envoyerParCourriel = () => {
    const estSortie = onglet === "sortie";
    const titre = estSortie
      ? (state.sortie.nom || "Sortie / Voyage scolaire")
      : (state.erasmus.intitule || "Projet Erasmus+");
    const accompErasmus = (state.erasmus.accompagnateurs || []).map(a => a.nom).filter(Boolean).join(", ");
    const responsable = estSortie ? state.sortie.enseignant : accompErasmus;
    const sujet = "Budget prévisionnel — " + titre + " — Lycée Léopold ELFORT (Mana)";
    const corps =
      "Bonjour,\n\n" +
      "Veuillez trouver ci-joint le budget prévisionnel pour : " + titre + ".\n" +
      (responsable ? ("Responsable : " + responsable + "\n") : "") +
      "Module : " + (estSortie ? "Sortie / Voyage scolaire" : "Projet Erasmus+") + "\n" +
      "Date de génération : " + auj() + "\n\n" +
      "⚠️ Pensez à joindre le PDF :\n" +
      "1) Cliquez sur « Générer le récapitulatif PDF » puis enregistrez le document en PDF.\n" +
      "2) Joignez ce PDF à ce courriel avant de l'envoyer.\n\n" +
      "Cordialement,\n" + (responsable || "");
    /* Propose d'abord de générer le PDF, puis ouvre le client de messagerie */
    if (window.confirm("Voulez-vous d'abord générer le PDF à joindre ?\n\nOK = ouvrir l'aperçu PDF, puis revenez cliquer à nouveau pour le courriel.\nAnnuler = ouvrir directement le courriel.")) {
      window.print();
      return;
    }
    window.location.href = "mailto:" + COURRIEL_ETAB +
      "?subject=" + encodeURIComponent(sujet) +
      "&body=" + encodeURIComponent(corps);
  };
  const dupliquerBudget = () => {
    const copie = JSON.parse(JSON.stringify(state));
    copie.sortie.nom = (copie.sortie.nom || "Sortie") + " (copie)";
    copie.erasmus.intitule = (copie.erasmus.intitule || "Projet") + " (copie)";
    copie.meta = { creeLe: auj(), version: 4 };
    dispatch({ type: "REMPLACER", payload: copie });
    window.alert("Budget dupliqué. Vous pouvez maintenant le modifier — pensez à l'imprimer ou l'exporter.");
  };
  const exporter = () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const nom = (state.sortie.nom || "budget").replace(/[^a-z0-9]/gi, "_").toLowerCase();
    a.href = url; a.download = "budget_" + nom + ".json"; a.click();
    URL.revokeObjectURL(url);
  };
  const importerRef = useRef();
  const importer = (ev) => {
    const f = ev.target.files[0];
    if (!f) return;
    const lecteur = new FileReader();
    lecteur.onload = () => {
      try {
        const data = JSON.parse(lecteur.result);
        const base = etatInitial();
        dispatch({ type: "REMPLACER", payload: {
          ...base, ...data,
          sortie: { ...base.sortie, ...(data.sortie||{}) },
          erasmus: { ...base.erasmus, ...(data.erasmus||{}) },
        }});
        window.alert("Budget importé avec succès.");
      } catch (e) { window.alert("Fichier invalide : impossible de l'importer."); }
    };
    lecteur.readAsText(f);
    ev.target.value = "";
  };

  const moduleNom = onglet === "sortie" ? "Sortie / Voyage scolaire" : "Projet Erasmus+";

  return (
    <div>
      {/* ====================== EN-TÊTE ====================== */}
      <header className="app-header">
        <div className="logo-badge">LE</div>
        <div>
          <h1>Lycée Léopold ELFORT — Mana</h1>
          <div className="sub">Outil de budget prévisionnel des sorties & voyages scolaires · Guyane Française</div>
        </div>
        <div className="header-spacer"></div>
        <div className="save-state no-print">
          {sauveLe ? <span>💾 Enregistré <b>{sauveLe}</b></span> : <span>💾 Sauvegarde auto activée</span>}
        </div>
      </header>

      {/* ====================== BARRE D'OUTILS ====================== */}
      <div className="toolbar no-print">
        <button className="btn-bleu" onClick={() => window.print()}>🖨️ Générer le récapitulatif PDF</button>
        <button className="btn-vert" onClick={envoyerParCourriel}>✉️ Transmettre par courriel</button>
        <button className="btn-gris" onClick={dupliquerBudget}>📑 Dupliquer</button>
        <button className="btn-gris" onClick={exporter}>💾 Sauvegarder mon travail</button>
        <button className="btn-gris" onClick={() => importerRef.current.click()}>📂 Ouvrir mon travail</button>
        <input ref={importerRef} type="file" accept="application/json,.json" style={{ display: "none" }} onChange={importer} />
        <button className="btn-orange" style={{ marginLeft: "auto" }} onClick={reinitialiser}>🧹 Réinitialiser</button>
        <button className="btn-rouge" onClick={nouveauBudget}>🗑️ Nouveau budget</button>
      </div>

      <main>
        {/* ====================== GUIDE ====================== */}
        <div className="guide-banner no-print">
          <h3>👋 Bienvenue — comment ça marche&nbsp;?</h3>
          <ol>
            <li>Choisissez le <b>type de projet</b> ci-dessous (sortie classique ou Erasmus+).</li>
            <li>Remplissez les informations puis les <b>dépenses</b> : les totaux se calculent automatiquement.</li>
            <li>Renseignez la section <b>Accompagnateurs</b> (dépenses du personnel encadrant).</li>
            <li>Indiquez les <b>subventions</b> : l'outil calcule <b>ce que paiera chaque famille</b> (ou utilisez le montant que vous connaissez déjà).</li>
            <li>Cliquez sur <b>🖨️ Générer le récapitulatif PDF</b> pour imprimer ou enregistrer en PDF.</li>
          </ol>
        </div>

        {/* ====================== ONGLETS ====================== */}
        <div className="tabs no-print">
          <button className={"tab" + (onglet === "sortie" ? " actif" : "")} onClick={() => setOnglet("sortie")}>
            <span className="num">1</span> Sortie / Voyage
          </button>
          <button className={"tab tab-bleu" + (onglet === "erasmus" ? " actif" : "")} onClick={() => setOnglet("erasmus")}>
            <span className="num">2</span> Projet Erasmus+
          </button>
        </div>

        <EnteteImpression moduleNom={moduleNom} />

        {/* ====================== CONTENU ====================== */}
        {onglet === "sortie"  && <ModuleSortie  state={state} dispatch={dispatch} calc={calcSortie} />}
        {onglet === "erasmus" && <ModuleErasmus state={state} dispatch={dispatch} calc={calcErasmus} />}

        <div className="footer-note print-only">Document généré par l'outil de budget scolaire – usage interne.</div>
        <div className="footer-note no-print">
          Lycée Polyvalent Léopold ELFORT · Mana · Guyane Française — Outil interne. Vos données restent sur cet ordinateur (sauvegarde locale).
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
//]]>
  </script>
</body>
</html>
